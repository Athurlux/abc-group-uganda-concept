    <script>
      // Homepage only: preload the one hero this device will show, and hold the headline
      // lines until the entrance timeline starts. The timer reveals them if it never does.
      // Buttons and navigation are never hidden.
      if (location.pathname === '/') {
        [['(min-width: 768px)', '/images/hero-desktop-960.webp 960w, /images/hero-desktop-1536.webp 1536w', '(min-width: 1100px) 58vw, 100vw'],
         ['(max-width: 767px)', '/images/hero-mobile-480.webp 480w, /images/hero-mobile-800.webp 800w', '100vw']].forEach(function (hero) {
          var link = document.createElement('link')
          link.rel = 'preload'; link.as = 'image'; link.media = hero[0]
          link.setAttribute('imagesrcset', hero[1]); link.setAttribute('imagesizes', hero[2]); link.setAttribute('fetchpriority', 'high')
          document.head.appendChild(link)
        })
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('hero-pending')
          setTimeout(function () { document.documentElement.classList.remove('hero-pending') }, 2500)
        }
      }
    </script>
